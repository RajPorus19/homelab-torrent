services:

  # =============================================
  # qBittorrent + OpenVPN (NordVPN)
  # =============================================
  qbittorrent:
    image: binhex/arch-qbittorrentvpn:latest
    container_name: qbittorrent
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"
      - "8118:8118"
    volumes:
      - ./config/qbittorrent:/config
      - ./data/torrents:/data/torrents
      - ./vpn:/config/openvpn
    environment:
      - VPN_ENABLED=${VPN_ENABLED:-yes}
      - VPN_PROV=custom
      - VPN_CLIENT=openvpn
      - VPN_USER=${NORDVPN_USER}
      - VPN_PASS=${NORDVPN_PASS}
      - STRICT_PORT_FORWARD=no
      - ENABLE_PRIVOXY=yes
      - LAN_NETWORK=${LAN_NETWORK:-192.168.1.0/24}
      - NAME_SERVERS=103.86.96.100,103.86.99.100
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_USERNAME=${WEBUI_USERNAME}
      - WEBUI_PASSWORD=${WEBUI_PASSWORD}
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # =============================================
  # Prowlarr — indexer manager
  # =============================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./config/prowlarr:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9696/ping"]
      interval: 60s
      timeout: 10s
      retries: 3

  # =============================================
  # Radarr — movie automation
  # =============================================
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    volumes:
      - ./config/radarr:/config
      - ./data:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3

  # =============================================
  # Sonarr — TV series automation
  # =============================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - ./config/sonarr:/config
      - ./data:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3

  # =============================================
  # Bazarr — automatic subtitles
  # =============================================
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - "6767:6767"
    volumes:
      - ./config/bazarr:/config
      - ./data/media:/data/media
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "http://127.0.0.1:6767/"]
      interval: 60s
      timeout: 10s
      retries: 3

  # =============================================
  # Jellyfin — media server (NVIDIA GPU)
  # =============================================
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ./config/jellyfin:/config
      - ./data/media:/data/media
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8096/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================
  # FlareSolverr — Cloudflare bypass
  # =============================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/"]
      interval: 60s
      timeout: 10s
      retries: 3

  # =============================================
  # Homer — dashboard
  # =============================================
  homer:
    image: b4bz/homer:latest
    container_name: homer
    ports:
      - "8888:8080"
    volumes:
      - ./config/homer:/www/assets
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 60s
      timeout: 10s
      retries: 3

  # =============================================
  # Diun — Docker image update notifier
  # =============================================
  diun:
    image: crazymax/diun:latest
    container_name: diun
    volumes:
      - ./config/diun/diun.yml:/diun.yml:ro
      - ./config/diun/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "diun", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3

  # =============================================
  # Seerr — media request & discovery (successeur de Jellyseerr/Overseerr)
  # Migration depuis Jellyseerr : automatique au 1er demarrage sur cette image.
  # Le dossier ./config/seerr reprend l'ancien config/jellyseerr tel quel.
  # =============================================
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    ports:
      - "5055:5055"
    volumes:
      - ./config/seerr:/app/config
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
      - PORT=5055
    networks:
      - medianet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  medianet:
    driver: bridge
